<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Sistem Arayüzü</title>
    <style>
        :root {
            --jarvis-blue: #00f3ff;
            --jarvis-dark: #050a0f;
            --jarvis-panel: rgba(0, 40, 60, 0.6);
        }
        
        body {
            background-color: var(--jarvis-dark);
            color: var(--jarvis-blue);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header {
            text-align: center;
            font-size: 24px;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--jarvis-blue);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--jarvis-blue);
        }

        .container {
            display: flex;
            gap: 20px;
            height: calc(100% - 80px);
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--jarvis-panel);
            border: 1px solid var(--jarvis-blue);
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .panel-title {
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.5);
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
        }

        input[type="password"], input[type="text"], select {
            width: 100%;
            background: transparent;
            border: 1px solid var(--jarvis-blue);
            color: var(--jarvis-blue);
            padding: 5px;
            box-sizing: border-box;
            outline: none;
        }
        
        select option {
            background-color: var(--jarvis-dark);
            color: var(--jarvis-blue);
        }

        button {
            background: rgba(0, 243, 255, 0.1);
            color: var(--jarvis-blue);
            border: 1px solid var(--jarvis-blue);
            padding: 8px 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            width: 100%;
            margin-top: 5px;
        }

        button:hover {
            background: var(--jarvis-blue);
            color: var(--jarvis-dark);
            box-shadow: 0 0 15px var(--jarvis-blue);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-box {
            flex-grow: 1;
            background: var(--jarvis-panel);
            border: 1px solid var(--jarvis-blue);
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-left: 3px solid var(--jarvis-blue);
            background: rgba(0, 243, 255, 0.05);
            word-wrap: break-word;
        }

        .message.user {
            border-left: none;
            border-right: 3px solid #ffaa00;
            text-align: right;
            background: rgba(255, 170, 0, 0.05);
            color: #ffaa00;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls input {
            flex-grow: 1;
            padding: 15px;
            font-size: 16px;
        }

        .btn-mic {
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff3333;
            color: #ff3333;
            width: auto;
            padding: 0 20px;
        }
        
        .btn-mic.recording {
            background: #ff3333;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .widget-area {
            height: 250px;
            display: none;
            border: 1px solid var(--jarvis-blue);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>
<body>

    <div class="header">J.A.R.V.I.S. Çevrimiçi</div>

    <div class="container">
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">SİSTEM YAPILANDIRMASI (API)</div>
                
                <div class="input-group">
                    <label>Gemini API Key</label>
                    <input type="password" id="geminiKey" placeholder="AI Studio'dan alın...">
                </div>
                
                <div class="input-group">
                    <label>Groq API Key</label>
                    <input type="password" id="groqKey" placeholder="Groq Konsolundan alın...">
                </div>

                <div class="input-group">
                    <label>Grok (xAI) API Key</label>
                    <input type="password" id="grokKey" placeholder="xAI platformundan alın...">
                </div>
                
                <div class="input-group">
                    <label>Aktif Model Seçimi</label>
                    <select id="activeModel">
                        <option value="gemini">Google Gemini</option>
                        <option value="groq">Groq (Llama vs)</option>
                        <option value="grok">Grok (xAI)</option>
                    </select>
                </div>
                
                <button onclick="saveKeys()">Yapılandırmayı Kaydet</button>
            </div>

            <div class="panel">
                <div class="panel-title">HIZLI MODÜLLER</div>
                <button onclick="openMap('İstanbul')">Haritayı Başlat</button>
                <button onclick="openSearch('Hava durumu')">Web Araması</button>
                <button onclick="clearChat()">Terminali Temizle</button>
            </div>
        </div>

        <div class="main-content">
            <div class="widget-area" id="widgetArea">
                <!-- Harita veya Web sonuçları buraya gelecek -->
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message">Sistem başlatıldı. J.A.R.V.I.S. hizmetinize hazır efendim.</div>
            </div>

            <div class="controls">
                <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤 SES</button>
                <input type="text" id="userInput" placeholder="Komut girin veya konuşun... (Örn: Haritada Ankara'yı göster, Web'de yapay zeka ara)">
                <button onclick="processInput()" style="width: 150px;">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        // API Anahtarlarını Yerel Hafızadan Yükle
        window.onload = () => {
            document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';
            document.getElementById('groqKey').value = localStorage.getItem('groqKey') || '';
            document.getElementById('grokKey').value = localStorage.getItem('grokKey') || '';
            document.getElementById('activeModel').value = localStorage.getItem('activeModel') || 'gemini';
        };

        function saveKeys() {
            localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
            localStorage.setItem('groqKey', document.getElementById('groqKey').value);
            localStorage.setItem('grokKey', document.getElementById('grokKey').value);
            localStorage.setItem('activeModel', document.getElementById('activeModel').value);
            addMessage("Jarvis", "API yapılandırmaları sisteme kaydedildi.");
            speak("Yapılandırma güncellendi efendim.");
        }

        // Enter tuşu ile gönderme
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") processInput();
        });

        function addMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'User' ? 'user' : ''}`;
            msgDiv.innerHTML = `<strong>${sender === 'User' ? 'Sen' : 'J.A.R.V.I.S.'}:</strong> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // SES SENTEZİ (Konuşma)
        function speak(text) {
            // Eğer hata mesajıysa (uzun ve karmaşıksa) tamamını okumasını engelleyebiliriz
            if(text.includes("API Hatası") || text.includes("Bağlantı Hatası")) {
                text = "Sistem bağlantısında bir hata oluştu efendim. Lütfen ekranı kontrol edin.";
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.pitch = 0.8;
            utterance.rate = 1.1; 
            window.speechSynthesis.speak(utterance);
        }

        // SES TANIMA (Mikrofon)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                processInput();
            };

            recognition.onend = () => {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').innerText = "🎤 SES";
            };
        } else {
            addMessage("Sistem", "Tarayıcınız ses tanıma özelliğini desteklemiyor.");
        }

        function toggleMic() {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').innerText = "🔴 DİNLİYOR...";
            }
        }

        // ANA İŞLEM MERKEZİ (Komut Ayrıştırma)
        async function processInput() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) return;

            addMessage("User", input);
            document.getElementById('userInput').value = '';

            const lowerInput = input.toLowerCase();

            // 1. Özel Komut Kontrolü (Harita ve Arama)
            if (lowerInput.includes("haritada") || lowerInput.includes("harita aç")) {
                const location = input.replace(/haritada|göster|harita aç/gi, '').trim();
                openMap(location || 'Türkiye');
                const reply = `Harita modülü ${location || 'Türkiye'} için başlatılıyor.`;
                addMessage("Jarvis", reply);
                speak(reply);
                return;
            }

            if (lowerInput.includes("internette ara") || lowerInput.includes("web'de ara") || lowerInput.includes("web araması")) {
                const query = input.replace(/internette ara|web'de ara|web araması|yap/gi, '').trim();
                openSearch(query);
                const reply = `Ağ üzerinde "${query}" için arama protokolü başlatıldı.`;
                addMessage("Jarvis", reply);
                speak(reply);
                return;
            }

            // 2. Yapay Zeka API'sine Gönderme
            const activeModel = document.getElementById('activeModel').value;
            addMessage("Jarvis", "Sinyal işleniyor..."); // Yükleniyor mesajı
            
            try {
                let aiResponse = "";
                
                if (activeModel === "gemini") {
                    aiResponse = await callGemini(input);
                } else if (activeModel === "groq") {
                    aiResponse = await callGroq(input);
                } else if (activeModel === "grok") {
                    aiResponse = await callGrok(input);
                }

                // Yükleniyor mesajını silip gerçeğini yazdır
                const chatBox = document.getElementById('chatBox');
                chatBox.removeChild(chatBox.lastChild); 
                
                addMessage("Jarvis", aiResponse);
                speak(aiResponse);

            } catch (error) {
                const chatBox = document.getElementById('chatBox');
                chatBox.removeChild(chatBox.lastChild);
                addMessage("Jarvis", "Sistem Hatası: Beklenmeyen bir bağlantı kopukluğu yaşandı.");
                speak("Beklenmeyen bir hata oluştu efendim.");
                console.error(error);
            }
        }

        // GEMINI API ÇAĞRISI
        async function callGemini(prompt) {
            const key = document.getElementById('geminiKey').value;
            if(!key) return "Sistem Uyarısı: Gemini API anahtarı eksik. Lütfen sol panelden girin.";
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Sen Jarvis adında akıllı bir yapay zeka asistanısın. Kısa, net ve havalı cevaplar ver. Soru: " + prompt }] }]
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `API Hatası (Gemini): ${data.error.message}`;
                }
                
                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                return `Bağlantı Hatası: ${err.message}`;
            }
        }

        // GROQ API ÇAĞRISI
        async function callGroq(prompt) {
            const key = document.getElementById('groqKey').value;
            if(!key) return "Sistem Uyarısı: Groq API anahtarı eksik.";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {role: "system", content: "Sen Jarvis'sin. Kısa, havalı ve yardımcı cevaplar ver."},
                            {role: "user", content: prompt}
                        ]
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `API Hatası (Groq): ${data.error.message}`;
                }
                
                return data.choices[0].message.content;
            } catch (err) {
                return `Bağlantı veya CORS Hatası (Groq): Bu API doğrudan tarayıcı üzerinden istekleri engelliyor olabilir. Hata Detayı: ${err.message}`;
            }
        }

        // GROK (xAI) API ÇAĞRISI
        async function callGrok(prompt) {
            const key = document.getElementById('grokKey').value;
            if(!key) return "Sistem Uyarısı: Grok API anahtarı eksik.";

            try {
                const response = await fetch("https://api.x.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "grok-beta",
                        messages: [
                            {role: "system", content: "Sen Jarvis'sin. Zeki ve net bir asistansın."},
                            {role: "user", content: prompt}
                        ]
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `API Hatası (Grok): ${data.error.message}`;
                }
                
                return data.choices[0].message.content;
            } catch (err) {
                return `Bağlantı veya CORS Hatası (Grok): Bu API doğrudan tarayıcı üzerinden istekleri engelliyor olabilir. Hata Detayı: ${err.message}`;
            }
        }

        // WIDGET KONTROLLERİ (Harita ve Arama)
        function openMap(location) {
            const widgetArea = document.getElementById('widgetArea');
            widgetArea.style.display = 'block';
            widgetArea.innerHTML = `<iframe src="https://nominatim.openstreetmap.org/ui/search.html?q=${encodeURIComponent(location)}"></iframe>`;
        }

        function openSearch(query) {
            const widgetArea = document.getElementById('widgetArea');
            widgetArea.style.display = 'block';
            widgetArea.innerHTML = `<iframe src="https://duckduckgo.com/search.html?q=${encodeURIComponent(query)}&kp=-2"></iframe>`;
        }

        function clearChat() {
            document.getElementById('chatBox').innerHTML = '<div class="message">Terminal temizlendi. Sistem hazır.</div>';
            document.getElementById('widgetArea').style.display = 'none';
        }
    </script>
</body>
</html>
