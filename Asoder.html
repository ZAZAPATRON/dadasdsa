<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX_AI // TERMINAL_INTERFACE</title>
    <style>
        :root {
            --bg-color: #05080c;
            --term-bg: #0d1117;
            --text-main: #00ff66;
            --text-dim: #008833;
            --text-user: #58a6ff;
            --border: #00ff6644;
            --accent: #00ff66;
            --danger: #ff4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fira Code', 'Courier New', Consolas, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar & Config */
        .config-bar {
            background: var(--term-bg);
            border: 1px solid var(--border);
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        select, input, button {
            background: #161b22;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 10px;
            outline: none;
            font-size: 13px;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 5px var(--accent);
        }

        button {
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent);
            color: #000;
        }

        /* Terminal Body */
        .terminal {
            flex: 1;
            background: var(--term-bg);
            border: 1px solid var(--border);
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 10px #000;
        }

        .msg {
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg.system { color: var(--text-dim); }
        .msg.user { color: var(--text-user); }
        .msg.ai { color: var(--text-main); }
        .msg.error { color: var(--danger); }

        /* Controls Area */
        .input-bar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .input-bar textarea {
            flex: 1;
            background: var(--term-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            resize: none;
            height: 50px;
        }

        .tool-bar {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }

        .tool-btn {
            font-size: 11px;
            opacity: 0.8;
        }

        .tool-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }

        /* Generated Image Container */
        .gen-img {
            max-width: 300px;
            border: 1px solid var(--accent);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="config-bar">
        <span>[MODEL]:</span>
        <select id="providerSelect">
            <option value="groq">Groq AI (Llama 3 / Mixtral)</option>
            <option value="gemini">Google Gemini AI</option>
            <option value="claude">Anthropic Claude AI</option>
            <option value="grok">xAI Grok AI</option>
        </select>

        <span>[API_KEY]:</span>
        <input type="password" id="apiKeyInput" placeholder="API Key Yapıştırın..." style="flex:1;">
    </div>

    <div class="terminal" id="terminalOutput">
        <div class="msg system">>>> CODEX_AI SYSTEM INITIALIZED...</div>
        <div class="msg system">>>> API Anahtarınızı girin, modeli seçin ve komut çalıştırın.</div>
    </div>

    <div class="tool-bar">
        <button class="tool-btn" id="btnWebSearch" onclick="toggleTool('search')">[WEB SEARCH: OFF]</button>
        <button class="tool-btn" id="btnMap" onclick="toggleTool('map')">[MAPS: OFF]</button>
        <button class="tool-btn" id="btnImgGen" onclick="toggleTool('image')">[IMAGE GEN: OFF]</button>
        <button class="tool-btn" onclick="exportFile()">[DOSYA OLUŞTUR / İNDİR]</button>
    </div>

    <div class="input-bar">
        <textarea id="promptInput" placeholder="Komut veya mesajınızı girin..."></textarea>
        <button id="micBtn" onclick="toggleMic()">🎤</button>
        <button onclick="sendPrompt()">GÖNDER</button>
    </div>

    <script>
        let isSearchActive = false;
        let isMapActive = false;
        let isImageActive = false;
        let recognition = null;

        // Tool Toggles
        function toggleTool(tool) {
            if (tool === 'search') {
                isSearchActive = !isSearchActive;
                document.getElementById('btnWebSearch').classList.toggle('active', isSearchActive);
                document.getElementById('btnWebSearch').innerText = `[WEB SEARCH: ${isSearchActive ? 'ON' : 'OFF'}]`;
            } else if (tool === 'map') {
                isMapActive = !isMapActive;
                document.getElementById('btnMap').classList.toggle('active', isMapActive);
                document.getElementById('btnMap').innerText = `[MAPS: ${isMapActive ? 'ON' : 'OFF'}]`;
            } else if (tool === 'image') {
                isImageActive = !isImageActive;
                document.getElementById('btnImgGen').classList.toggle('active', isImageActive);
                document.getElementById('btnImgGen').innerText = `[IMAGE GEN: ${isImageActive ? 'ON' : 'OFF'}]`;
            }
        }

        function appendLog(text, type = 'ai') {
            const term = document.getElementById('terminalOutput');
            const msg = document.createElement('div');
            msg.className = `msg ${type}`;
            msg.innerText = text;
            term.appendChild(msg);
            term.scrollTop = term.scrollHeight;
            return msg;
        }

        // Voice Input (Microphone)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = false;

            recognition.onresult = (event) => {
                document.getElementById('promptInput').value = event.results[0][0].transcript;
                document.getElementById('micBtn').style.background = '';
            };

            recognition.onerror = () => {
                document.getElementById('micBtn').style.background = '';
            };
        }

        function toggleMic() {
            if (!recognition) {
                alert("Tarayıcınız ses tanıma özelliğini desteklemiyor.");
                return;
            }
            document.getElementById('micBtn').style.background = 'var(--accent)';
            recognition.start();
        }

        // API Call Dispatcher
        async function sendPrompt() {
            const inputEl = document.getElementById('promptInput');
            const prompt = inputEl.value.trim();
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const provider = document.getElementById('providerSelect').value;

            if (!prompt) return;
            if (!apiKey) {
                appendLog("HATA: Lütfen geçerli bir API Key girin.", "error");
                return;
            }

            appendLog(`> USER: ${prompt}`, "user");
            inputEl.value = '';

            // Handle Image Generation Mode
            if (isImageActive) {
                appendLog(">>> Görsel oluşturuluyor...", "system");
                const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=512&height=512&seed=${Math.floor(Math.random()*1000)}`;
                const imgEl = document.createElement('img');
                imgEl.src = imgUrl;
                imgEl.className = 'gen-img';
                document.getElementById('terminalOutput').appendChild(imgEl);
                return;
            }

            let modifiedPrompt = prompt;
            if (isSearchActive) modifiedPrompt += " (Not: Web araması modunu simüle ederek güncel verilerle yanıtla)";
            if (isMapActive) modifiedPrompt += " (Not: Konum ve harita koordinat bilgisi ekleyerek yanıtla)";

            appendLog(`>>> Processing request via ${provider.toUpperCase()}...`, "system");

            try {
                let responseText = "";
                if (provider === 'groq') {
                    responseText = await callGroq(apiKey, modifiedPrompt);
                } else if (provider === 'gemini') {
                    responseText = await callGemini(apiKey, modifiedPrompt);
                } else if (provider === 'claude') {
                    responseText = await callClaude(apiKey, modifiedPrompt);
                } else if (provider === 'grok') {
                    responseText = await callGrok(apiKey, modifiedPrompt);
                }
                appendLog(responseText, "ai");
            } catch (err) {
                appendLog(`HATA: ${err.message}`, "error");
            }
        }

        // Provider API Handlers
        async function callGroq(apiKey, prompt) {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [{ role: 'user', content: prompt }]
                })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            return data.choices[0].message.content;
        }

        async function callGemini(apiKey, prompt) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            return data.candidates[0].content.parts[0].text;
        }

        async function callClaude(apiKey, prompt) {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json',
                    'dangerously-allow-browser': 'true'
                },
                body: JSON.stringify({
                    model: 'claude-3-5-sonnet-20241022',
                    max_tokens: 1024,
                    messages: [{ role: 'user', content: prompt }]
                })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error.message || data.error.type);
            return data.content[0].text;
        }

        async function callGrok(apiKey, prompt) {
            const res = await fetch('https://api.x.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'grok-beta',
                    messages: [{ role: 'user', content: prompt }]
                })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            return data.choices[0].message.content;
        }

        // Save Terminal Logs to File
        function exportFile() {
            const logs = document.getElementById('terminalOutput').innerText;
            const blob = new Blob([logs], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `codex_session_${Date.now()}.txt`;
            a.click();
        }
    </script>
</body>
</html>
